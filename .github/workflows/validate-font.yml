name: Validate font

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font build dependencies
        run: python -m pip install -r requirements.txt
      - name: Export font formats and validate cmap
        run: python tools/build_font.py
