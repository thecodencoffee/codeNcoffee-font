<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codencoffee Bold · Specimen</title>
<link rel="stylesheet" href="codencoffee.css">
<style>
body{margin:0;padding:36px;background:#101014;color:#f4f4f6;font:16px/1.6 system-ui,sans-serif}
main{max-width:1100px;margin:auto}.hero{font-size:clamp(56px,10vw,120px);line-height:1.1;margin:12px 0 36px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:#9999a5;margin-top:32px}
.sample{font-size:clamp(28px,5vw,52px);line-height:1.5;overflow-wrap:anywhere}
small{color:#9b9ba7}
</style>
</head>
<body><main>
<h1 class="codencoffee">Codencoffee Bold</h1>
<div class="hero codencoffee">codeNcoffee</div>
<h2>Uppercase</h2><div class="sample codencoffee">ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
<h2>Lowercase</h2><div class="sample codencoffee">abcdefghijklmnopqrstuvwxyz</div>
<h2>Digits</h2><div class="sample codencoffee">0123456789</div>
<h2>Punctuation and symbols</h2><div class="sample codencoffee">!"#$%&amp;'()*+,-./:;&lt;=&gt;?@[\\]^_&#96;{|}~</div>
<h2>Additional Unicode</h2><div class="sample codencoffee">₹ × ÷ ¿ ¡</div>
<small>Rendered from the actual Codencoffee-Bold.woff2 file.</small>
</main></body></html>
